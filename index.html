<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portfolio</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
}

header {
    text-align: center;
    padding: 50px;
    background: linear-gradient(135deg, #6366f1, #06b6d4);
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.card {
    background: #1e293b;
    padding: 15px;
    margin: 10px 0;
    border-radius: 10px;
}

h2 {
    border-left: 5px solid #06b6d4;
    padding-left: 10px;
}

.skills span {
    background: #06b6d4;
    color: black;
    padding: 5px 10px;
    margin: 5px;
    display: inline-block;
    border-radius: 20px;
}
</style>
</head>

<body>

<header>
    <h1>Your Name</h1>
    <p>Student | Developer | Learner</p>
</header>

<div class="container">

    <h2>About Me</h2>
    <div class="card">
        I am a Computer Science student interested in app development and AI.
    </div>

    <h2>Projects</h2>
    <div class="card">
        Library Management App (Flutter)
    </div>
    <div class="card">
        No-Spend Tracker App
    </div>

    <h2>Skills</h2>
    <div class="skills">
        <span>Flutter</span>
        <span>Python</span>
        <span>HTML</span>
        <span>CSS</span>
    </div>

    <h2>Contact</h2>
    <div class="card">
        Email: your@email.com
    </div>

</div>

</body>
</html>
